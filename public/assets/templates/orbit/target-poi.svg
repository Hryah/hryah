<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer subtle scan halo -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#0D1736" stroke-width="24" opacity="0.9"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#206876" stroke-width="11"/>

    <!-- Segmented active cyan orbital arcs -->
    <path d="M 106,142 A 196,196 0 0 1 370,106" fill="none" stroke="#0D1736" stroke-width="22"/>
    <path d="M 106,142 A 196,196 0 0 1 370,106" fill="none" stroke="#3EA2F6" stroke-width="11"/>
    <path d="M 406,370 A 196,196 0 0 1 142,406" fill="none" stroke="#0D1736" stroke-width="22"/>
    <path d="M 406,370 A 196,196 0 0 1 142,406" fill="none" stroke="#3EA2F6" stroke-width="11"/>

    <!-- Inner metallic calibration ring -->
    <circle cx="256" cy="256" r="126" fill="none" stroke="#0D1736" stroke-width="18"/>
    <circle cx="256" cy="256" r="126" fill="none" stroke="#C0C8DD" stroke-width="7.5" stroke-dasharray="36 28"/>

    <!-- 4 Bold cardinal targeting ticks (N, E, S, W) -->
    <rect x="242" y="24" width="28" height="72" rx="10" fill="#E3E0E2" stroke="#0D1736" stroke-width="9"/>
    <rect x="242" y="416" width="28" height="72" rx="10" fill="#C0C8DD" stroke="#0D1736" stroke-width="9"/>
    <rect x="24" y="242" width="72" height="28" rx="10" fill="#E3E0E2" stroke="#0D1736" stroke-width="9"/>
    <rect x="416" y="242" width="72" height="28" rx="10" fill="#C0C8DD" stroke="#0D1736" stroke-width="9"/>
    <!-- Orange reticle tip accents -->
    <circle cx="256" cy="60" r="7" fill="#FAAC31"/>
    <circle cx="256" cy="452" r="7" fill="#F3832D"/>
    <circle cx="60" cy="256" r="7" fill="#FAAC31"/>
    <circle cx="452" cy="256" r="7" fill="#F3832D"/>

    <!-- Central orbital beacon diamond (pure 2D cel faceted) -->
    <polygon points="256,162 350,256 256,350 162,256" fill="#FAAC31" stroke="#0D1736" stroke-width="11"/>
    <polygon points="256,168 256,256 168,256" fill="#FBD37B"/>
    <polygon points="256,256 344,256 256,344" fill="#F3832D"/>
    <polygon points="256,162 350,256 256,350 162,256" fill="none" stroke="#0D1736" stroke-width="11"/>

    <!-- Center glass sensor core -->
    <circle cx="256" cy="256" r="32" fill="#206876" stroke="#0D1736" stroke-width="9"/>
    <circle cx="256" cy="256" r="16" fill="#3EA2F6" stroke="#0D1736" stroke-width="6"/>
    <circle cx="250" cy="250" r="5.5" fill="#B2D7E8"/>
  </g>
</svg>