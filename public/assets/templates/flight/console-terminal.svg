<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 108" width="216" height="108">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear bulkhead mounting brackets -->
    <rect x="34" y="6" width="26" height="16" rx="4" fill="#FAAC31" stroke="#0D1736" stroke-width="5"/>
    <rect x="156" y="6" width="26" height="16" rx="4" fill="#FAAC31" stroke="#0D1736" stroke-width="5"/>
    <!-- Side cable coupler lugs -->
    <rect x="6" y="34" width="16" height="36" rx="6" fill="#9AA8C4" stroke="#0D1736" stroke-width="5"/>
    <rect x="194" y="34" width="16" height="36" rx="6" fill="#9AA8C4" stroke="#0D1736" stroke-width="5"/>
    <!-- Main armored workstation housing -->
    <polygon points="24,18 192,18 202,28 202,88 186,100 30,100 14,88 14,28"
             fill="#C0C8DD" stroke="#0D1736" stroke-width="6"/>
    <!-- Upper highlight & lower cel shadow band -->
    <rect x="26" y="23" width="164" height="12" rx="4" fill="#E3E0E2"/>
    <path d="M 18,78 L 198,78 L 185,96 L 31,96 Z" fill="#788FB3"/>
    <!-- Monitor bezel & recessed cyan waveform screen -->
    <rect x="36" y="28" width="144" height="34" rx="7" fill="#32446A" stroke="#0D1736" stroke-width="4.5"/>
    <rect x="42" y="33" width="106" height="24" rx="4" fill="#0B1F3A" stroke="#206876" stroke-width="2.5"/>
    <!-- Telemetry waveform & UI bars inside screen -->
    <polyline points="47,47 58,47 64,39 71,52 78,41 85,48 96,48 103,40 110,47 142,47"
              fill="none" stroke="#3EA2F6" stroke-width="3"/>
    <circle cx="137" cy="40" r="2.8" fill="#FBD37B"/>
    <!-- 3 Diagnostic LEDs -->
    <circle cx="163" cy="39" r="3.6" fill="#3DDC84" stroke="#0D1736" stroke-width="2"/>
    <circle cx="163" cy="51" r="3.6" fill="#FAAC31" stroke="#0D1736" stroke-width="2"/>
    <!-- Sloped front tactile keyboard deck (pure 2D top-down) -->
    <rect x="44" y="68" width="84" height="22" rx="4" fill="#2F4173" stroke="#0D1736" stroke-width="3.5"/>
    <rect x="50" y="72" width="14" height="6" rx="1.5" fill="#C0C8DD"/>
    <rect x="68" y="72" width="14" height="6" rx="1.5" fill="#C0C8DD"/>
    <rect x="86" y="72" width="14" height="6" rx="1.5" fill="#C0C8DD"/>
    <rect x="104" y="72" width="18" height="6" rx="1.5" fill="#3EA2F6"/>
    <rect x="54" y="81" width="54" height="5" rx="1.5" fill="#9AA8C4"/>
    <!-- Master safety lock dial / emergency button -->
    <circle cx="154" cy="79" r="10" fill="#F3832D" stroke="#0D1736" stroke-width="3.5"/>
    <circle cx="154" cy="79" r="4.5" fill="#FBD37B"/>
  </g>
</svg>