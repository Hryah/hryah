<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <clipPath id="hab-floor-clip">
      <polygon points="75.8,14.0 844.2,14.0 906.0,75.8 906.0,404.2 844.2,466.0 75.8,466.0 14.0,404.2 14.0,75.8"/>
    </clipPath>
  </defs>
  <!-- Pure 2D Top-Down Habitat Module Floor -->
  <polygon points="70.0,0.0 850.0,0.0 920.0,70.0 920.0,410.0 850.0,480.0 70.0,480.0 0.0,410.0 0.0,70.0" fill="#1B2945"/>
  <g clip-path="url(#hab-floor-clip)">
    <!-- Subtle modular floor panelling (2D orthographic, zero skew) -->
    <rect x="65" y="42" width="790" height="396" rx="18" fill="#233457" opacity="0.65"/>
    <!-- Central zero-G walkway spine -->
    <rect x="30" y="182" width="885" height="116" fill="#141F36" opacity="0.55"/>
    <line x1="50" y1="182" x2="905" y2="182" stroke="#788FB3" stroke-width="2.5" opacity="0.35"/>
    <line x1="50" y1="298" x2="905" y2="298" stroke="#788FB3" stroke-width="2.5" opacity="0.35"/>
    <!-- Structural floor bulkhead ribs -->
    <rect x="141" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="150" y1="18" x2="150" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="271" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="280" y1="18" x2="280" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="451" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="460" y1="18" x2="460" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="631" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="640" y1="18" x2="640" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="761" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="770" y1="18" x2="770" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/>
    <!-- Upper/lower utility cable channels -->
    <rect x="80" y="64" width="760" height="10" rx="5" fill="#206876" opacity="0.48"/>
    <rect x="80" y="406" width="760" height="10" rx="5" fill="#206876" opacity="0.48"/>
    <!-- Corner structural gusset plates -->
    <polygon points="14,72 72,14 110,14 14,110" fill="#32446A" opacity="0.5"/>
    <polygon points="906,72 848,14 810,14 906,110" fill="#32446A" opacity="0.5"/>
    <polygon points="14,408 72,466 110,466 14,370" fill="#32446A" opacity="0.5"/>
    <polygon points="906,408 848,466 810,466 906,370" fill="#32446A" opacity="0.5"/>
    <!-- Exact portholes (280,145) & (640,145) r=46 -->
    <g id="porthole-hab-l">
      <!-- Outer bolted flange -->
      <circle cx="280" cy="145" r="58" fill="#788FB3" stroke="#0D1736" stroke-width="4.5"/>
      <circle cx="280" cy="145" r="51" fill="#C0C8DD" stroke="#0D1736" stroke-width="3.5"/>
      <!-- 8 Perimeter bolts -->
      <circle cx="334.5" cy="145.0" r="2.6" fill="#0D1736"/><circle cx="318.5" cy="183.5" r="2.6" fill="#0D1736"/><circle cx="280.0" cy="199.5" r="2.6" fill="#0D1736"/><circle cx="241.5" cy="183.5" r="2.6" fill="#0D1736"/><circle cx="225.5" cy="145.0" r="2.6" fill="#0D1736"/><circle cx="241.5" cy="106.5" r="2.6" fill="#0D1736"/><circle cx="280.0" cy="90.5" r="2.6" fill="#0D1736"/><circle cx="318.5" cy="106.5" r="2.6" fill="#0D1736"/>
      <!-- Starry deep-space interior lens -->
      <circle cx="280" cy="145" r="46" fill="#091326" stroke="#0D1736" stroke-width="4"/>
      <circle cx="265.3" cy="133.5" r="2.1" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="292.9" cy="158.8" r="1.6" fill="#B2D7E8" opacity="0.8"/>
      <circle cx="288.3" cy="125.7" r="1.4" fill="#FFFFFF" opacity="0.65"/>
      <circle cx="273.1" cy="165.7" r="1.2" fill="#3EA2F6" opacity="0.75"/>
      <!-- Subtle orbital planet rim curve -->
      <path d="M 246.9,164.3 Q 280.0,148.7 314.0,162.5"
            fill="none" stroke="#3EA2F6" stroke-width="2.8" opacity="0.32" stroke-linecap="round"/>
      <!-- Diagonal glass reflection glare -->
      <ellipse cx="264.4" cy="129.4" rx="12.9" ry="6.0"
               transform="rotate(-38 264.4 129.4)" fill="#B2D7E8" opacity="0.62"/>
      <circle cx="276.3" cy="122.0" r="3.4" fill="#FFFFFF" opacity="0.72"/>
    </g>
    <g id="porthole-hab-r">
      <!-- Outer bolted flange -->
      <circle cx="640" cy="145" r="58" fill="#788FB3" stroke="#0D1736" stroke-width="4.5"/>
      <circle cx="640" cy="145" r="51" fill="#C0C8DD" stroke="#0D1736" stroke-width="3.5"/>
      <!-- 8 Perimeter bolts -->
      <circle cx="694.5" cy="145.0" r="2.6" fill="#0D1736"/><circle cx="678.5" cy="183.5" r="2.6" fill="#0D1736"/><circle cx="640.0" cy="199.5" r="2.6" fill="#0D1736"/><circle cx="601.5" cy="183.5" r="2.6" fill="#0D1736"/><circle cx="585.5" cy="145.0" r="2.6" fill="#0D1736"/><circle cx="601.5" cy="106.5" r="2.6" fill="#0D1736"/><circle cx="640.0" cy="90.5" r="2.6" fill="#0D1736"/><circle cx="678.5" cy="106.5" r="2.6" fill="#0D1736"/>
      <!-- Starry deep-space interior lens -->
      <circle cx="640" cy="145" r="46" fill="#091326" stroke="#0D1736" stroke-width="4"/>
      <circle cx="625.3" cy="133.5" r="2.1" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="652.9" cy="158.8" r="1.6" fill="#B2D7E8" opacity="0.8"/>
      <circle cx="648.3" cy="125.7" r="1.4" fill="#FFFFFF" opacity="0.65"/>
      <circle cx="633.1" cy="165.7" r="1.2" fill="#3EA2F6" opacity="0.75"/>
      <!-- Subtle orbital planet rim curve -->
      <path d="M 606.9,164.3 Q 640.0,148.7 674.0,162.5"
            fill="none" stroke="#3EA2F6" stroke-width="2.8" opacity="0.32" stroke-linecap="round"/>
      <!-- Diagonal glass reflection glare -->
      <ellipse cx="624.4" cy="129.4" rx="12.9" ry="6.0"
               transform="rotate(-38 624.4 129.4)" fill="#B2D7E8" opacity="0.62"/>
      <circle cx="636.3" cy="122.0" r="3.4" fill="#FFFFFF" opacity="0.72"/>
    </g>
  </g>
  <!-- Armored 2D Hull Perimeter Wall Ring (thickness ~14px, open doorway on RIGHT y=180..300) -->
  <path d="M 913.0,180 L 913.0,70 L 850.0,7 L 70.0,7 L 7,70 L 7,410.0 L 70.0,473.0 L 850.0,473.0 L 913.0,410.0 L 913.0,300"
        fill="none" stroke="#0D1736" stroke-width="20" stroke-linejoin="round" stroke-linecap="butt"/>
  <path d="M 913.0,180 L 913.0,70 L 850.0,7 L 70.0,7 L 7,70 L 7,410.0 L 70.0,473.0 L 850.0,473.0 L 913.0,410.0 L 913.0,300"
        fill="none" stroke="#C0C8DD" stroke-width="10" stroke-linejoin="round" stroke-linecap="butt"/>
  <path d="M 913.0,180 L 913.0,70 L 850.0,7 L 70.0,7 L 7,70 L 7,410.0 L 70.0,473.0 L 850.0,473.0 L 913.0,410.0 L 913.0,300"
        fill="none" stroke="#788FB3" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="butt" transform="translate(0,1.5)"/>
  <g>
      <rect x="905.0" y="168.0" width="18" height="14" rx="4" fill="#FAAC31" stroke="#0D1736" stroke-width="3.5"/>
      <rect x="905.0" y="298.0" width="18" height="14" rx="4" fill="#FAAC31" stroke="#0D1736" stroke-width="3.5"/>
      <line x1="913.0" y1="180.0" x2="913.0" y2="300.0" stroke="#3EA2F6" stroke-width="3" stroke-dasharray="8 8" opacity="0.55"/>
    </g>
</svg>