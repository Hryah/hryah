    <rect x="30" y="182" width="885" height="116" fill="#141F36" opacity="0.55"/>
    <line x1="50" y1="182" x2="905" y2="182" stroke="#788FB3" stroke-width="2.5" opacity="0.35"/>
    <line x1="50" y1="298" x2="905" y2="298" stroke="#788FB3" stroke-width="2.5" opacity="0.35"/>
    <!-- Structural floor bulkhead ribs -->
    <rect x="141" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="150" y1="18" x2="150" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="271" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="280" y1="18" x2="280" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="451" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="460" y1="18" x2="460" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="631" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="640" y1="18" x2="640" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/><rect x="761" y="14" width="18" height="452" fill="#32446A" opacity="0.45"/><line x1="770" y1="18" x2="770" y2="462" stroke="#788FB3" stroke-width="2" opacity="0.35"/>
    <!-- Upper/lower utility cable channels -->
    <rect x="80" y="64" width="760" height="10" rx="5" fill="#206876" opacity="0.48"/>
    <rect x="80" y="406" width="760" height="10" rx="5" fill="#206876" opacity="0.48"/>
    <!-- Corner structural gusset plates -->
    <polygon points="14,72 72,14 110,14 14,110" fill="#32446A" opacity="0.5"/>
    <polygon points="906,72 848,14 810,14 906,110" fill="#32446A" opacity="0.5"/>
    <polygon points="14,408 72,466 110,466 14,370" fill="#32446A" opacity="0.5"/>
    <polygon points="906,408 848,466 810,466 906,370" fill="#32446A" opacity="0.5"/>
